name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-29" \
            "build-tools;29.0.3" \
            "ndk;23.1.7779620"
          yes | sdkmanager --licenses || true

      - name: Extract project
        run: |
          mkdir source
          ZIP="$(find . -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$ZIP"
          unzip -q "$ZIP" -d source
          find source -name gradlew -type f

      - name: Build APK
        run: |
          PROJECT="$(dirname "$(find source -name gradlew -type f -print -quit)")"
          test -n "$PROJECT"
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yamaneko-debug-apk
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

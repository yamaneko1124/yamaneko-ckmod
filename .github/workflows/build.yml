name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-29" \
            "build-tools;29.0.3" \
            "ndk;23.1.7779620"

      - name: Extract project
        run: |
          mkdir -p source
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$ZIP"
          unzip -q "$ZIP" -d source
          find source -name gradlew -type f

      - name: Build APK
        run: |
          WRAPPER="$(find source -name gradlew -type f -print -quit)"
          test -n "$WRAPPER"
          PROJECT="$(dirname "$WRAPPER")"
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yamaneko-debug-apk
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
